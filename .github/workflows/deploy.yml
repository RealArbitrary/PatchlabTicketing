name: Deploy Patchlab Ticketing

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v7

      - name: Install client dependencies
        run: npm install
        working-directory: patchlabticketing.client

      - name: Build React client
        run: npm run build
        working-directory: patchlabticketing.client

      - name: Stop PatchlabTicketing service
        run: C:\nssm\win64\nssm.exe stop PatchlabTicketing

      - name: Clear old wwwroot
        run: if (Test-Path PatchlabTicketing.Api\wwwroot) { Remove-Item -Recurse -Force PatchlabTicketing.Api\wwwroot }
        shell: powershell

      - name: Copy client build into API wwwroot
        run: Copy-Item -Recurse patchlabticketing.client\dist PatchlabTicketing.Api\wwwroot
        shell: powershell

      - name: Publish PatchlabTicketing.Api
        run: dotnet publish PatchlabTicketing.Api\PatchlabTicketing.Api.csproj -c Release -o C:\PatchlabTicketing\publish

      - name: Start PatchlabTicketing service
        shell: powershell
        run: |
          $serviceName = "PatchlabTicketing"

          try {
              & C:\nssm\win64\nssm.exe start $serviceName
          } catch {
              Write-Host "nssm start reported an error (expected if it raced SERVICE_START_PENDING): $_"
          }

          # nssm start checks status immediately after issuing the START control and can
          # see SERVICE_START_PENDING before the service finishes coming up, exiting 1 on
          # a service that's actually fine seconds later. Poll real status instead of
          # trusting that exit code.
          $timeoutSeconds = 60
          $intervalSeconds = 2
          $elapsed = 0
          $status = ""

          while ($elapsed -lt $timeoutSeconds) {
              $status = (& C:\nssm\win64\nssm.exe status $serviceName).Trim()
              Write-Host "$serviceName status: $status (${elapsed}s elapsed)"
              if ($status -eq "SERVICE_RUNNING") {
                  Write-Host "$serviceName reached SERVICE_RUNNING."
                  exit 0
              }
              Start-Sleep -Seconds $intervalSeconds
              $elapsed += $intervalSeconds
          }

          Write-Error "$serviceName did not reach SERVICE_RUNNING within $timeoutSeconds seconds (last status: $status)."
          exit 1
